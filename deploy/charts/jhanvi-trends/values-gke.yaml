# Overrides shared by every GKE cluster built by this repo (dev, stage, prod).
# Layered as values.yaml -> values-gke.yaml -> values-<env>.yaml; image tags live in values-<env>.yaml.

global:
  environment: gke-dev
  # OTel gateway installed by the infra repo; it fans out to Tempo / Prometheus / Loki.
  otlpEndpoint: http://otel-gateway.observability.svc:4317

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # ClusterIssuer name created by the infra repo

# GKE node pools (labels set by Terraform)
nodeSelectors:
  services:
    workload: apps
  datastores:
    workload: stateful

# GCE persistent disks (pd-balanced). Online resize supported.
postgres:
  storageClassName: standard-rwo
mongodb:
  storageClassName: standard-rwo
redis:
  storageClassName: standard-rwo
kafka:
  storageClassName: standard-rwo

# Default-deny NetworkPolicies (enforced by GKE Dataplane V2) and Traefik security headers + rate limits.
networkPolicies:
  enabled: true
edgeSecurity:
  enabled: true
