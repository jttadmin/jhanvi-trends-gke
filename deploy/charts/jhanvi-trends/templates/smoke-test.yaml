{{- /*
Post-deploy smoke test, run by Argo CD as a PostSync hook after every sync, once all resources are
healthy. It checks every service's readiness endpoint inside the cluster, then a few real API calls
through the frontend.

If it fails, the sync ends as Failed, so Argo CD does NOT send the "deployed" notification and the
automatic promotion to the next environment never starts (see promote.yaml).

The Job is kept after it finishes (BeforeHookCreation only), so a failure can be read with:
  kubectl -n jhanvi-trends logs job/smoke-test
*/ -}}
{{- if .Values.smokeTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  labels:
    app.kubernetes.io/name: smoke-test
    {{- include "jhanvi-trends.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.smokeTest.timeoutSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-test
        app.kubernetes.io/part-of: jhanvi-trends
    spec:
      restartPolicy: Never
      {{- include "jhanvi-trends.pullSecrets" . | nindent 6 }}
      enableServiceLinks: false
      {{- include "jhanvi-trends.nodeSelector" (dict "root" . "group" "services") | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # curl_user in the curlimages/curl image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: smoke-test
          image: {{ .Values.smokeTest.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Retries each URL for up to ~2.5 minutes, because pods that were just replaced may still be warming up.
              check() {
                url="$1"; tries=0
                while :; do
                  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url")
                  [ "$code" = "200" ] && { echo "ok    $url"; return 0; }
                  tries=$((tries + 1))
                  if [ "$tries" -ge 30 ]; then echo "FAIL  $url (HTTP $code)"; return 1; fi
                  sleep 5
                done
              }
              fail=0
              echo "== readiness"
              {{- range $name, $svc := .Values.services }}
              check "http://{{ $name }}:8080{{ $svc.probes.readiness }}" || fail=1
              {{- end }}
              echo "== store API through the frontend"
              check "http://frontend:8080/" || fail=1
              check "http://frontend:8080/api/categories" || fail=1
              check "http://frontend:8080/api/products" || fail=1
              [ "$fail" -eq 0 ] && echo "Smoke test passed." || echo "Smoke test FAILED."
              exit "$fail"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
{{- end }}
