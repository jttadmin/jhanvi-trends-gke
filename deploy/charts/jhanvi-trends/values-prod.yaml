# prod: tags arrive only through the promote workflow (stage -> prod PR).
# Layered after values.yaml and values-gke.yaml (see argocd/envs/prod/jhanvi-trends.yaml).
# Keep this file small: image tags plus the few settings that really differ per environment.

global:
  environment: gke-prod

ingress:
  host: shop.bhumaji.com
  tls:
    - hosts: [shop.bhumaji.com]
      secretName: shop-tls

services:
  frontend:
    image:
      tag: f3570491dd62613f56e398c02bb9c004cedd12bd
  user-service:
    image:
      tag: f3570491dd62613f56e398c02bb9c004cedd12bd
  catalog-service:
    image:
      tag: e4b55898c1b9ad7515568b4a6164e565aa878e59
  cart-service:
    image:
      tag: e4b55898c1b9ad7515568b4a6164e565aa878e59
  inventory-service:
    image:
      tag: e4b55898c1b9ad7515568b4a6164e565aa878e59
  order-service:
    image:
      tag: f3570491dd62613f56e398c02bb9c004cedd12bd
  payment-service:
    image:
      tag: f3570491dd62613f56e398c02bb9c004cedd12bd
  notification-service:
    image:
      tag: e4b55898c1b9ad7515568b4a6164e565aa878e59

loadgen:
  # No synthetic shoppers in production: they would skew real business metrics and alerts.
  enabled: false
  image:
    tag: e4b55898c1b9ad7515568b4a6164e565aa878e59

# Nightly database dumps (bucket + service account created by Terraform: `terraform output backups`).
backups:
  enabled: true
  bucket: jhanvi-trends-prd-2611-jhanvi-trends-gke-backups
  gcpServiceAccount: jhanvi-trends-gke-db-backup@jhanvi-trends-prd-2611.iam.gserviceaccount.com
