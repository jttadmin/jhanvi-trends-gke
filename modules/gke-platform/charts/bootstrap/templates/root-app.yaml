# App-of-apps: Argo CD reads every Application manifest under gitops.path
# (your microservices, Postgres, MongoDB, Redis, Kafka, LGTM) and syncs them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jhanvi-trends-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL | quote }}
    targetRevision: {{ .Values.gitops.targetRevision | quote }}
    path: {{ .Values.gitops.path | quote }}
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
