# Repository-wide checks that don't belong to one service: committed secrets and Dockerfile lint.
name: repo-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Scan git history for secrets
        # Runs the official image directly (the gitleaks GitHub Action needs a paid licence for organisations).
        # A finding fails the job; the secret is redacted in the log. If it is a real secret: rotate it first,
        # then remove it from history. If it is a false positive: add it to .gitleaksignore.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git . --redact --verbose --no-banner

  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          dockerfile: Dockerfile
          failure-threshold: warning
