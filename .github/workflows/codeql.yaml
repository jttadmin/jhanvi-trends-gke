# CodeQL: static security analysis of the source code itself (Trivy in ci.yaml scans the built images).
# Findings appear under Security -> Code scanning.
name: codeql

on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/codeql.yaml"]
  pull_request:
    paths: ["services/**", ".github/workflows/codeql.yaml"]
  schedule:
    - cron: "23 21 * * 0" # weekly (Sunday 21:23 UTC), catches new queries for unchanged code
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript # frontend, user-service, payment-service
            build-mode: none
          - language: python # catalog-service, notification-service, loadgen
            build-mode: none
          - language: java-kotlin # order-service
            build-mode: none
          - language: go # cart-service, inventory-service
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Must run before codeql init, so CodeQL traces this Go toolchain.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/cart-service/go.mod
          cache: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/public/**"
              - "**/test/**"
              - "**/tests/**"
              - "**/*_test.go"

      - name: Build Go services
        if: matrix.language == 'go'
        run: |
          for svc in cart-service inventory-service; do
            (cd "services/$svc" && go mod tidy && go build ./...)
          done

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
