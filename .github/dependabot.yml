# Weekly dependency update PRs, grouped per ecosystem so each week is a few PRs, not dozens.
# Go services are not listed: they have no committed go.sum and resolve the latest compatible
# modules at build time (go mod tidy in the Dockerfile), so there is nothing pinned to bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directories: ["/services/*"]
    schedule: {interval: weekly}
    groups:
      base-images: {patterns: ["*"]}
  - package-ecosystem: npm
    directories: ["/services/frontend", "/services/user-service", "/services/payment-service"]
    schedule: {interval: weekly}
    groups:
      npm-dev: {dependency-type: development}
      npm-prod: {dependency-type: production, update-types: [minor, patch]}
  - package-ecosystem: pip
    directories: ["/services/catalog-service", "/services/notification-service"]
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: maven
    directory: /services/order-service
    schedule: {interval: weekly}
    groups:
      maven: {patterns: ["*"], update-types: [minor, patch]}
