# Tenancy boundary for the store in stage: one repo, one namespace, no cluster-scoped objects
# except the Namespace that CreateNamespace=true makes. Created before the app (sync-wave -1).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jhanvi-trends
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Jhanvi Trends store (stage)
  sourceRepos:
    - https://github.com/jttadmin/jhanvi-trends-gke.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jhanvi-trends
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  orphanedResources:
    warn: true
