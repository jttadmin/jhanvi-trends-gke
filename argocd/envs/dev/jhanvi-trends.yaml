# Jhanvi Trends on GKE (dev). Synced by the root app that Terraform installs (envs/dev/main.tf
# sets gitops_apps_path = "argocd/envs/dev").
#
# Platform pieces (Traefik, cert-manager, Prometheus/Grafana, Loki, Tempo, OTel) are owned by
# Terraform in modules/gke-platform, so only the store chart is deployed from here.
# Image tags for this environment live in values-dev.yaml.
#
# One-time, before the first sync: create the app secret (see docs/APP.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jhanvi-trends
  namespace: argocd
  labels:
    env: dev # read by the Argo CD notification that starts the next promotion
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # When this env is synced, healthy and its smoke test passed, tell GitHub (repository_dispatch).
    # promote.yaml then opens the PR to the next environment. Configured in modules/gke-platform/addons.tf.
    notifications.argoproj.io/subscribe.on-deployed-dispatch.github-dispatch: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: jhanvi-trends
  destination:
    server: https://kubernetes.default.svc
    namespace: jhanvi-trends
  source:
    repoURL: https://github.com/jttadmin/jhanvi-trends-gke.git
    targetRevision: main
    path: deploy/charts/jhanvi-trends
    helm:
      releaseName: jhanvi-trends
      valueFiles:
        - values.yaml
        - values-gke.yaml
        - values-dev.yaml
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
    # Pod Security Admission: enforce "baseline" (no privileged, hostPath, host network...).
    # "restricted" is reported (warn/audit) but not enforced, because the database images
    # (postgres, mongo, valkey, kafka) start as root before dropping privileges.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
  # HPAs own the replica count of the services, so Argo CD must not reset it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
