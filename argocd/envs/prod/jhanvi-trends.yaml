# Jhanvi Trends on GKE (prod). Synced by the root app that Terraform installs (envs/prod/main.tf
# sets gitops_apps_path = "argocd/envs/prod").
#
# Platform pieces (Traefik, cert-manager, Prometheus/Grafana, Loki, Tempo, OTel) are owned by
# Terraform in modules/gke-platform, so only the store chart is deployed from here.
# Image tags for this environment live in values-prod.yaml.
#
# One-time, before the first sync: create the app secret (see docs/APP.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jhanvi-trends
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: jhanvi-trends
  destination:
    server: https://kubernetes.default.svc
    namespace: jhanvi-trends
  source:
    repoURL: https://github.com/jttadmin/jhanvi-trends-gke.git
    targetRevision: main
    path: deploy/charts/jhanvi-trends
    helm:
      releaseName: jhanvi-trends
      valueFiles:
        - values.yaml
        - values-gke.yaml
        - values-prod.yaml
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
    syncOptions:
      - CreateNamespace=true
  # HPAs own the replica count of the services, so Argo CD must not reset it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
