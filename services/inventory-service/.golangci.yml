# golangci-lint v2. Run locally: golangci-lint run ./...  (CI runs it in the Dockerfile test stage)
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # single-package service; exported doc comments add no value here
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck]
formatters:
  enable:
    - gofmt
