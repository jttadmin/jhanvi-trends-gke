# SonarCloud analysis settings, used by .github/workflows/sonarcloud.yaml.
sonar.organization=jttadmin
sonar.projectKey=jttadmin_jhanvi-trends-gke
sonar.projectName=Jhanvi Trends (GKE)

sonar.sources=services
sonar.tests=services
sonar.test.inclusions=services/*/test/**,services/*/tests/**,services/**/*_test.go,services/order-service/src/test/**
sonar.exclusions=services/*/test/**,services/*/tests/**,services/**/*_test.go,services/order-service/src/test/**,\
  **/node_modules/**,services/frontend/public/**,services/catalog-service/app/photos/**,**/coverage/**
sonar.sourceEncoding=UTF-8

# Coverage reports produced by each Dockerfile's "coverage" stage (paths rewritten by the workflow).
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info,coverage/user-service/lcov.info,coverage/payment-service/lcov.info
sonar.python.coverage.reportPaths=coverage/catalog-service/coverage.xml,coverage/notification-service/coverage.xml
sonar.go.coverage.reportPaths=coverage/cart-service/coverage.out,coverage/inventory-service/coverage.out
sonar.coverage.jacoco.xmlReportPaths=coverage/order-service/jacoco.xml
sonar.java.binaries=coverage/order-service/classes
sonar.java.source=21
sonar.python.version=3.13
